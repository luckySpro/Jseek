[workspace]
resolver = "2"
members = ["crates/jseek-core", "crates/jseek-platform", "crates/jseek-engine", "app/src-tauri"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["M&J Group <473276@qq.com>"]
repository = "https://github.com/luckySpro/Jseek"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
