name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lockfiles must live in the repo (lucky-rust-fullstack, appendix D). If one is missing,
  # generate it once and commit it back; the push starts a fresh run with locked deps.
  lockfiles:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.gen.outputs.created }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - id: gen
        run: |
          created=false
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; created=true; fi
          if [ ! -f app/pnpm-lock.yaml ]; then (cd app && pnpm install --lockfile-only); created=true; fi
          echo "created=$created" >> "$GITHUB_OUTPUT"
          if [ "$created" = true ] && [ "${{ github.event_name }}" = push ]; then
            git config user.name "jseek-ci"; git config user.email "ci@users.noreply.github.com"
            git add Cargo.lock app/pnpm-lock.yaml
            git commit -m "chore: add lockfiles generated by CI"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  core:
    needs: lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Test core crates
        run: cargo test -p jseek-core -p jseek-platform
      - name: Clippy core crates
        run: cargo clippy -p jseek-core -p jseek-platform --all-targets -- -D warnings

  # C++ engine test suite (~12k checks) — macOS baseline; Linux/Windows join in M1.
  engine-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install re2
      - name: Engine tests
        working-directory: engine
        run: |
          set +e
          make test-fast > engine-tests.log 2>&1; status=$?
          grep -E "error:" engine-tests.log | head -10 | sed 's/^/::error::/'
          grep -F "[FAIL]" engine-tests.log | sort | uniq -c | head -30 | sed 's/^ *//; s/^/::warning::/'
          grep -E "Tests (passed|failed):" engine-tests.log | tr '\n' ' ' | sed 's/^/::notice::/'; echo
          tail -20 engine-tests.log
          exit $status

  engine-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libre2-dev cmake pkg-config
      - name: Build & test engine
        working-directory: engine
        run: |
          set +e
          { cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j4; } > build.log 2>&1; status=$?
          grep -E "error:|Error " build.log | sort -u | head -30 | sed 's/^/::error::/'
          if [ $status -ne 0 ]; then tail -20 build.log; exit $status; fi
          ./build/test_all --fast > engine-tests.log 2>&1; status=$?
          grep -F "[FAIL]" engine-tests.log | sort | uniq -c | head -30 | sed 's/^ *//; s/^/::warning::/'
          grep -E "Tests (passed|failed):" engine-tests.log | tr '\n' ' ' | sed 's/^/::notice::/'; echo
          tail -15 engine-tests.log
          exit $status

  engine-windows:
    runs-on: windows-latest
    continue-on-error: true   # M1 in progress: collect errors, then make blocking
    steps:
      - uses: actions/checkout@v4
      - name: Install re2 (vcpkg)
        shell: bash
        run: vcpkg install re2:x64-windows-static
      - name: Build & test engine
        working-directory: engine
        shell: bash
        run: |
          set +e
          { cmake -B build -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_MSVC_RUNTIME_LIBRARY='MultiThreaded$<$<CONFIG:Debug>:Debug>' \
            && cmake --build build --config Release -j4; } > build.log 2>&1; status=$?
          grep -E "error C[0-9]+|fatal error|error LNK" build.log | sed -E 's# \[[^]]*\]\r?$##; s#^.*[\\/]engine[\\/]##' | sort -u | head -40 | sed 's/^/::error::/'
          if [ $status -ne 0 ]; then tail -20 build.log; exit $status; fi
          # Run each fast part on its own so a crash names the part that caused it.
          parts=$(grep -oE 'selectedParts.insert\(\{"3".*\}\);' ../engine/test_all.cpp | head -1 | grep -oE '"[0-9a-z]+"' | tr -d '"')
          status=0; crashed=""; failedParts=""; total_pass=0; total_fail=0
          for p in $parts; do
            ./build/Release/test_all.exe --part "$p" > "part-$p.log" 2>&1; rc=$?
            pass=$(grep -oE "Tests passed: [0-9]+" "part-$p.log" | grep -oE "[0-9]+" || echo 0)
            fail=$(grep -oE "Tests failed: [0-9]+" "part-$p.log" | grep -oE "[0-9]+" || echo 0)
            total_pass=$((total_pass + ${pass:-0})); total_fail=$((total_fail + ${fail:-0}))
            if [ $rc -gt 1 ] || ! grep -q "Tests passed" "part-$p.log"; then
              crashed="$crashed $p"; status=1
              last=$(grep -E "^\s*(──|---|\[|[0-9]+\.)" "part-$p.log" | tail -1 | LC_ALL=C tr -cd '[:print:]' | cut -c1-200)
              echo "::error::part $p crashed (rc=$rc) after: $last"
            elif [ "${fail:-0}" != 0 ]; then
              failedParts="$failedParts $p"; status=1
              grep -E "\[FAIL\]|FAIL:" "part-$p.log" | head -5 | LC_ALL=C tr -cd '[:print:]\n' | sed "s/^ */::error::part $p /"
            fi
          done
          echo "::notice::Tests passed: $total_pass   Tests failed: $total_fail   crashed parts:${crashed:- none}   failing parts:${failedParts:- none}"
          exit $status

  app:
    needs: lockfiles
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, bundles: "app,dmg", name: macos-arm64 }
          - { os: macos-15, target: x86_64-apple-darwin, bundles: "app,dmg", name: macos-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundles: "nsis,msi", name: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - name: Install frontend deps
        working-directory: app
        shell: bash
        run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi
      - name: Build app (unsigned preview)
        working-directory: app
        shell: bash
        run: |
          set +e
          if [ "${{ runner.os }}" = "Windows" ]; then
            # WiX parses the publisher as XML: "&" must be escaped for the MSI only,
            # so the EXE (NSIS) keeps the real company name "M&J Group". The override lives in a
            # file because cmd.exe would split an inline JSON argument at "&".
            pnpm tauri build --target ${{ matrix.target }} --bundles nsis > build.log 2>&1
            status=$?
            if [ $status -eq 0 ]; then
              pnpm tauri build --target ${{ matrix.target }} --bundles msi \
                --config src-tauri/tauri.msi.conf.json >> build.log 2>&1
              status=$?
            fi
          else
            pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} > build.log 2>&1
            status=$?
          fi
          # Surface compiler errors as annotations (readable from the Checks API)
          grep -E "^error(\[E[0-9]+\])?:|error TS[0-9]+|ERR_|Error:" build.log | sort -u | head -30 | sed 's/^/::error::/'
          tail -40 build.log
          if [ $status -ne 0 ]; then
            # On failure also surface the last lines, whatever their wording
            tail -15 build.log | sed 's/\r$//; s/^/::warning title=build.log tail::/'
          fi
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: jseek-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
